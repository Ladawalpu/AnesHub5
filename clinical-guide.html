<style>
  :root{
    --bg: #FAF7F2;
    --panel: #FFFFFF;
    --ink: #241A12;
    --ink-soft: #7A6A57;
    --amber-deep: #B45309;
    --amber: #F59E0B;
    --cat-primary: #B45309;
    --cat-dark: #92400E;
    --line: #EEE3D3;
    --sans: 'Sarabun', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:0 16px 60px;}

  header{
    background: linear-gradient(160deg, var(--cat-primary) 0%, var(--cat-dark) 100%);
    color:#FFF7ED; padding:24px 18px 20px; position:relative;
    transition: background .25s ease;
  }
  header .inner{max-width:920px; margin:0 auto;}
  header h1{font-size:20px; margin:0 0 4px; font-weight:800;}
  header p.sub{margin:0; font-size:12.5px; color:#FDE9CE; font-weight:500;}

  .crumb{
    display:flex; align-items:center; gap:8px; padding:12px 16px 0; max-width:920px; margin:0 auto;
    font-size:12.5px; color:var(--ink-soft); font-weight:600; flex-wrap:wrap;
  }
  .crumb .seg{cursor:pointer;}
  .crumb .seg.current{color:var(--cat-primary); cursor:default; transition:color .2s ease;}
  .crumb .sep{opacity:.5;}

  .backbtn{
    display:inline-flex; align-items:center; gap:6px; margin:14px 0 4px;
    background:#fff; border:1.4px solid var(--line); color:var(--cat-primary);
    font-family:var(--sans); font-weight:700; font-size:13px; padding:8px 14px;
    border-radius:10px; cursor:pointer; transition:color .2s ease;
  }
  .backbtn:active{ background:#FDF3E7; }

  .grid8{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;
  }
  .cat-card{
    background:linear-gradient(160deg, rgba(255,255,255,.9), rgba(255,255,255,.7));
    border:1px solid var(--line); border-radius:16px; padding:14px 12px;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .cat-card:active{ transform:scale(.97); }
  .cat-pill{
    display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:.82rem;
    padding:6px 12px; border-radius:999px; color:#fff; margin-bottom:8px; white-space:nowrap;
  }
  .cat-card .cat-th{ font-size:.72rem; color:var(--ink-soft); line-height:1.4; margin-bottom:4px; }
  .cat-card .cat-count{ font-size:.68rem; font-weight:700; color:var(--ink-soft); }

  .proc-list{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .proc-item{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    -webkit-tap-highlight-color:transparent;
  }
  .proc-item:active{ background:#FDF3E7; }
  .proc-item .pname{ font-weight:700; font-size:14px; color:var(--ink); }
  .proc-item .chev{ color:var(--cat-primary); font-size:14px; transition:color .2s ease; }

  .detail-title{ font-size:19px; font-weight:800; margin:14px 0 2px; color:var(--ink); }
  .detail-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; }

  .acc{ border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--panel); }
  .acc-head{
    display:flex; align-items:center; justify-content:space-between; padding:13px 16px;
    cursor:pointer; font-weight:700; font-size:14px; color:var(--cat-primary);
    -webkit-tap-highlight-color:transparent; transition:color .2s ease;
  }
  .acc-head .chev{ transition:transform .15s ease; color:var(--ink-soft); font-size:13px; }
  .acc.open .acc-head .chev{ transform:rotate(180deg); }
  .acc-body{ display:none; padding:0 16px 16px; font-size:13px; line-height:1.7; color:var(--ink); }
  .acc.open .acc-body{ display:block; }

  .field{ margin-bottom:10px; }
  .field:last-child{ margin-bottom:0; }
  .field .flabel{ font-weight:700; font-size:12px; color:var(--ink-soft); margin-bottom:2px; }
  .field ul{ margin:2px 0 0; padding-left:18px; }
  .field ul li{ margin-bottom:3px; }

  .pearl-list, .ref-list{ margin:0; padding-left:18px; }
  .pearl-list li, .ref-list li{ margin-bottom:8px; }

  footer.disclaimer{
    margin-top:24px; font-size:11px; color:var(--ink-soft); line-height:1.6;
    border-top:1px solid var(--line); padding-top:14px;
  }

  @media (max-width:360px){
    .grid8{ gap:8px; }
    .cat-card{ padding:12px 10px; }
  }
</style>
</head>

", "Abdominal compartment syndrome", "Mortality สูงกว่า elective surgery อย่างมีนัยสำคัญ"], "postoperative_care": {"icu": "ICU monitoring แนะนำอย่างยิ่งในรายที่มี high risk score", "extubation": "ล่าช้าตามความเสถียรและความรุนแรงของ underlying pathology", "pain": "Multimodal analgesia", "complication_watch": ["Ongoing sepsis signs", "Renal function", "Coagulopathy", "Anastomotic complication"]}, "clinical_pearls": ["Emergency laparotomy มี mortality สูงกว่า elective abdominal surgery อย่างมาก - การใช้ risk scoring tool (NELA, P-POSSUM) ช่วย stratify risk และวางแผนการดูแลที่เหมาะสมตั้งแต่ต้น", "Time to source control มีผลต่อ mortality อย่างมีนัยสำคัญในผู้ป่วย intra-abdominal sepsis - ควรลดความล่าช้าในการนำผู้ป่วยเข้าห้องผ่าตัดให้มากที่สุดเท่าที่ปลอดภัย", "แนะนำให้มี senior anesthesiologist และ surgeon ร่วมดูแลผู้ป่วย high-risk emergency laparotomy ตาม national standard (เช่น NELA ในสหราชอาณาจักร) เนื่องจากมีผลต่อ outcome ที่ดีขึ้น"], "references": ["NELA (National Emergency Laparotomy Audit) Guideline", "Surviving Sepsis Campaign Guideline", "ASA/ESA Guideline for Emergency Surgery"]}], "_meta": {"id": "general_surgery", "emoji": "⚕️", "primary": "#16A34A", "dark": "#166534", "name_th": "วิสัญญีศัลยกรรมทั่วไป"}}}</script>
<script>
const DATA = JSON.parse(document.getElementById('cg-data').textContent);
const CATS = Object.keys(DATA).map(k => DATA[k]._meta ? {...DATA[k]._meta, key:k} : null).filter(Boolean);

const SECTION_LABELS = {
  overview: "ภาพรวม",
  preoperative_assessment: "การประเมินก่อนผ่าตัด",
  monitoring: "การติดตาม (Monitoring)",
  airway: "ทางเดินหายใจ (Airway)",
  induction: "การนำสลบ (Induction)",
  maintenance: "การคงสลบ (Maintenance)",
  ventilation: "การช่วยหายใจ (Ventilation)",
  fluid_management: "สารน้ำ (Fluid Management)",
  special_consideration: "ข้อพิจารณาพิเศษ",
  complications: "ภาวะแทรกซ้อน (Complications)",
  postoperative_care: "การดูแลหลังผ่าตัด",
  clinical_pearls: "Clinical Pearls 💡",
  references: "เอกสารอ้างอิง (References)"
};

const FIELD_LABELS = {
  definition: "นิยาม", indications: "ข้อบ่งชี้",
  labs: "Labs", imaging: "Imaging", consult: "Consult", optimization: "Optimization",
  standard: "มาตรฐาน", ibp: "IBP (Arterial Line)", cvp: "CVP", pa_catheter: "PA Catheter", tee: "TEE", bis: "BIS", nirs: "NIRS",
  plan: "แผนการ", equipment: "อุปกรณ์", backup: "แผนสำรอง",
  drug: "ยา", dose: "ขนาดยา", hemodynamic_goal: "เป้าหมาย Hemodynamic",
  volatile_tiva: "Volatile / TIVA", muscle_relaxant: "Muscle Relaxant", analgesia: "Analgesia", temperature: "อุณหภูมิ",
  tv: "Tidal Volume", peep: "PEEP", fio2: "FiO₂", recruitment: "Recruitment",
  goal_directed: "Goal-directed Therapy", blood: "เลือด", transfusion: "การให้เลือด",
  icu: "ICU", extubation: "Extubation", pain: "การจัดการความปวด", complication_watch: "สิ่งที่ต้องเฝ้าระวัง"
};

function fieldLabel(key){
  if(FIELD_LABELS[key]) return FIELD_LABELS[key];
  return key.split('_').map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

function renderValue(v){
  if(Array.isArray(v)){
    return '<ul>' + v.map(x => `<li>${x}</li>`).join('') + '</ul>';
  }
  return `<div>${v}</div>`;
}

function renderSection(key, val){
  if(key === 'complications' || key === 'clinical_pearls' || key === 'references'){
    const cls = key === 'references' ? 'ref-list' : 'pearl-list';
    return `<ul class="${cls}">${val.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  }
  // object with sub-fields
  let out = '';
  for(const [k, v] of Object.entries(val)){
    out += `<div class="field"><div class="flabel">${fieldLabel(k)}</div>${renderValue(v)}</div>`;
  }
  return out;
}

const DEFAULT_PRIMARY = '#B45309';
const DEFAULT_DARK = '#92400E';

function applyTheme(catKey){
  const root = document.documentElement.style;
  if(catKey && DATA[catKey] && DATA[catKey]._meta){
    root.setProperty('--cat-primary', DATA[catKey]._meta.primary);
    root.setProperty('--cat-dark', DATA[catKey]._meta.dark);
  } else {
    root.setProperty('--cat-primary', DEFAULT_PRIMARY);
    root.setProperty('--cat-dark', DEFAULT_DARK);
  }
}

let state = { view:'categories', catKey:null, procId:null };

function setCrumb(){
  const crumb = document.getElementById('crumb');
  let html = `<span class="seg ${state.view==='categories'?'current':''}" onclick="goCategories()">Clinical Guide</span>`;
  if(state.catKey){
    const cat = DATA[state.catKey];
    html += ` <span class="sep">›</span> <span class="seg ${state.view==='procedures'?'current':''}" onclick="goProcedures('${state.catKey}')">${cat.category}</span>`;
  }
  if(state.procId){
    const proc = DATA[state.catKey].procedures.find(p=>p.id===state.procId);
    html += ` <span class="sep">›</span> <span class="seg current">${proc.name}</span>`;
  }
  crumb.innerHTML = html;
}

function goCategories(){
  state = { view:'categories', catKey:null, procId:null };
  render();
}

function goProcedures(catKey){
  state = { view:'procedures', catKey, procId:null };
  render();
}

function goDetail(catKey, procId){
  state = { view:'detail', catKey, procId };
  render();
}

function render(){
  setCrumb();
  applyTheme(state.view === 'categories' ? null : state.catKey);
  const view = document.getElementById('view');
  if(state.view === 'categories'){
    let html = '<div class="grid8">';
    CATS.forEach(c => {
      const cat = DATA[c.key];
      html += `
        <div class="cat-card" onclick="goProcedures('${c.key}')">
          <div class="cat-pill" style="background:linear-gradient(120deg, ${c.primary}, ${c.dark});">
            <span>${c.emoji}</span>${cat.category}
          </div>
          <div class="cat-th">${c.name_th}</div>
          <div class="cat-count">${cat.procedures.length} หัตถการ</div>
        </div>`;
    });
    html += '</div>';
    view.innerHTML = html;
  }
  else if(state.view === 'procedures'){
    const cat = DATA[state.catKey];
    const meta = cat._meta;
    let html = `<button class="backbtn" onclick="goCategories()">← กลับไปหมวดทั้งหมด</button>`;
    html += `<div class="proc-list">`;
    cat.procedures.forEach(p => {
      html += `
        <div class="proc-item" onclick="goDetail('${state.catKey}','${p.id}')">
          <span class="pname">${p.name}</span>
          <span class="chev">›</span>
        </div>`;
    });
    html += `</div>`;
    view.innerHTML = html;
  }
  else if(state.view === 'detail'){
    const cat = DATA[state.catKey];
    const proc = cat.procedures.find(p => p.id === state.procId);
    let html = `<button class="backbtn" onclick="goProcedures('${state.catKey}')">← กลับไปรายการหัตถการ</button>`;
    html += `<div class="detail-title">${proc.name}</div>`;
    html += `<div class="detail-sub">${cat.category}</div>`;

    const order = ['overview','preoperative_assessment','monitoring','airway','induction','maintenance',
                   'ventilation','fluid_management','special_consideration','complications',
                   'postoperative_care','clinical_pearls','references'];

    order.forEach((key, idx) => {
      if(!proc[key]) return;
      const label = SECTION_LABELS[key] || key;
      const openClass = idx === 0 ? 'open' : '';
      html += `
        <div class="acc ${openClass}">
          <div class="acc-head" onclick="this.parentElement.classList.toggle('open')">
            <span>${label}</span><span class="chev">▾</span>
          </div>
          <div class="acc-body">${renderSection(key, proc[key])}</div>
        </div>`;
    });
    view.innerHTML = html;
    window.scrollTo(0,0);
  }
}

render();
</script>
</body>
</html>
