<title>AnesDose – คำนวณยาวิสัญญีตามน้ำหนัก</title>

<style>
:root{
  --bg:#fbf1f6;--card:#fff;--ink:#2a0f1c;--muted:#7d5568;--line:#f0d6e2;
  --accent:#be185d;--accent-soft:#fce7f1;--hdr:linear-gradient(135deg,#5e0b33 0%,#9d174d 55%,#c2185b 100%);--hdr-ink:#831843;--warn:#9a3412;--warn-soft:#fff3e8;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1a0a12;--card:#261019;--ink:#f8e6ef;--muted:#c094a8;--line:#40192b;
  --accent:#f472b6;--accent-soft:#3a1427;--hdr:linear-gradient(135deg,#33061b 0%,#5c0f33 60%,#7a1645 100%);--hdr-ink:#5c0f33;--warn:#fdba74;--warn-soft:#2c1f14;}
}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;padding:12px 14px 10px;box-shadow:0 2px 12px rgba(94,11,51,.3)}
.back{display:inline-block;color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 12px;margin-bottom:8px}
.logo{width:36px;height:36px;padding:4px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 small{font-weight:400;color:rgba(255,255,255,.78);font-size:12.5px;flex:1;min-width:0;line-height:1.25}
.mode{flex:none}
.inputs{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.1fr;gap:8px}
.f label{display:block;font-size:12px;color:rgba(255,255,255,.8);margin-bottom:2px}
.f input{width:100%;font:inherit;font-size:17px;padding:8px 10px;border:1px solid transparent;border-radius:10px;background:var(--card);color:var(--ink)}
.f input:focus{outline:2px solid #fbcfe8;border-color:transparent}
#w{font-weight:700;font-size:20px}
.sex{display:flex;border:1px solid transparent;border-radius:10px;overflow:hidden;background:var(--card)}
.sex button{flex:1;border:0;background:none;font:inherit;padding:9px 0;color:var(--muted);cursor:pointer}
.sex button.on{background:var(--accent);color:#fff}
.mode{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);margin-left:auto}
.mode button{border:0;background:none;font:inherit;font-size:14px;padding:5px 14px;color:rgba(255,255,255,.85);cursor:pointer}
.mode button.on{background:#fff;color:var(--hdr-ink);font-weight:700}
.ped{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.ped .name{margin-bottom:4px}
.ped .row{border-top:1px dashed var(--line)}
.na{font-size:13.5px;color:var(--warn);padding:6px 0}
.info{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:6px}
.tools{display:flex;gap:8px;margin-top:8px}
#q{flex:1;font:inherit;padding:8px 12px;border:1px solid transparent;border-radius:999px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:#fff;border-color:#fff;color:var(--hdr-ink);font-weight:600}
main{padding:12px 14px 40px}
.disc{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.cat-h{font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--accent));margin:20px 2px 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-h::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent))}
.cat-h::after{content:'';flex:1;height:2px;border-radius:2px;background:var(--c,var(--accent));opacity:.25}
.cc{--c:var(--cl)}
@media (prefers-color-scheme:dark){.cc{--c:var(--cd)}}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--cd)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--accent));border-radius:14px;box-shadow:0 1px 3px rgba(131,24,67,.07);padding:12px 14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:700;font-size:17px}
.conc{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.conc input{width:62px;font:inherit;font-size:14px;padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);text-align:right}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.lbl{font-weight:600;font-size:14.5px}
.pk{font-size:12.5px;color:var(--muted)}
.res{text-align:right;font-weight:700;font-size:16.5px;color:var(--c,var(--accent));white-space:nowrap}
.vol{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.cap{font-size:11.5px;color:var(--warn);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.note b{color:var(--warn);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 14px 30px}
@media (max-width:520px){.inputs{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="back" href="../anesth-drugs.html">‹ หมวดยา</a>
  <h1><img class="logo" src="icons/calc.svg" alt=""> AnesDose <small id="sub">คำนวณยาวิสัญญีตามน้ำหนัก</small>
    <span class="mode"><button data-m="A" class="on">ผู้ใหญ่</button><button data-m="P">เด็ก</button></span></h1>
  <div class="inputs">
    <div class="f"><label>น้ำหนัก (kg)</label><input id="w" type="number" inputmode="decimal" min="0" placeholder="เช่น 60"></div>
    <div class="f"><label>อายุ (ปี)</label><input id="age" type="number" inputmode="decimal" min="0" step="any" placeholder="เช่น 40"></div>
    <div class="f"><label>ส่วนสูง (cm)</label><input id="ht" type="number" inputmode="decimal" min="0" placeholder="ใช้คิด IBW"></div>
    <div class="f"><label>เพศ</label><div class="sex"><button data-s="M" class="on">ชาย</button><button data-s="F">หญิง</button></div></div>
  </div>
  <div class="info" id="info">กรอกน้ำหนักเพื่อคำนวณ</div>
  <div class="tools"><input id="q" type="search" placeholder="ค้นหายา…"></div>
  <div class="chips" id="chips"></div>
</div></header>

<main><div class="wrap">
  <div class="disc" id="disc"></div>
  <div class="ped" id="ped" hidden></div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>ไม่พบยาที่ค้นหา</div>
</div></main>
<footer>อ้างอิง: StatPearls, NYSORA, Morgan &amp; Mikhail's Clinical Anesthesiology, Miller's Anesthesia, Smith's Anesthesia for Infants and Children, Harriet Lane Handbook, AHA ACLS/PALS</footer>

function col(el,c){const v=COL[c];if(v){el.style.setProperty('--cl',v[0]);el.style.setProperty('--cd',v[1]);}}
const S={w:NaN,age:NaN,ht:NaN,sex:'M',mode:'A',cat:'ทั้งหมด',q:''};
const $=s=>document.querySelector(s);
const P=()=>S.mode==='P';

function fmt(n){if(!isFinite(n))return '—';const a=Math.abs(n);const d=a>=100?0:a>=10?1:a>=0.1?2:a>=0.01?3:4;return (+n.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});}
function rng(a,b,u){return (Math.abs(a-b)<1e-9?fmt(a):fmt(a)+'–'+fmt(b))+(u?' '+u:'');}
function conv(v,f,t){if(f===t)return v;if(f==='mg'&&t==='mcg')return v*1000;if(f==='mcg'&&t==='mg')return v/1000;return NaN;}
function ibw(){if(!(S.ht>0))return NaN;const v=(S.sex==='M'?50:45.5)+0.91*(S.ht-152.4);return v>0?v:NaN;}
function items(d){return P()&&d.pd!==undefined?d.pd:d.it;}
function note(d){return P()&&d.pnote?d.pnote:d.note;}
function pkLabel(it){
  const r=Math.abs(it.lo-it.hi)<1e-9?it.lo:it.lo+'–'+it.hi;
  const lim=(it.min?'ขั้นต่ำ '+it.min+' ':'')+(it.max?'สูงสุด '+it.max+' '+it.u:'');
  if(it.k==='b')return r+' '+it.u+'/kg'+(lim?' ('+lim.trim()+')':'');
  if(it.k==='i')return r+' '+it.u+'/kg/'+it.per;
  if(it.k==='fi')return r+' '+it.u+'/'+it.per;
  if(it.k==='fx')return 'ขนาดคงที่';
  if(it.k==='apap')return P()?'≤10 kg: 7.5 mg/kg · >10 kg: 15 mg/kg · >50 kg: 1 g':'≥50 kg: 1 g · <50 kg: 15 mg/kg';
  return '';
}
function volTxt(a,b,u,d,suf){const c=d._conc;if(!(c>0))return '';const x=conv(a,u,d.cu),y=conv(b,u,d.cu);if(!isFinite(x))return '';return '≈ '+rng(x/c,y/c,suf);}

function compute(it,d){
  const out={res:'—',vol:'',cap:''};
  if(it.k==='fx'){out.res=rng(it.lo,it.hi,it.u);if(!it.nv)out.vol=volTxt(it.lo,it.hi,it.u,d,'ml');return out;}
  if(it.k==='fi'){const m=it.per==='min'?60:1;const a=it.lo*m,b=it.hi*m;out.res=rng(a,b,it.u+'/h');out.vol=volTxt(a,b,it.u,d,'ml/h');return out;}
  const wt=it.ibw&&isFinite(ibw())?Math.min(ibw(),S.w):S.w;
  if(!(wt>0))return out;
  if(it.k==='b'){
    let a=it.lo*wt,b=it.hi*wt;
    if(it.max&&b>it.max){a=Math.min(a,it.max);b=it.max;out.cap='จำกัดที่ขนาดสูงสุด';}
    if(it.min&&a<it.min){a=it.min;b=Math.max(b,it.min);out.cap='ใช้ขนาดขั้นต่ำ';}
    out.res=rng(a,b,it.u);if(!it.nv)out.vol=volTxt(a,b,it.u,d,'ml');
  }else if(it.k==='i'){
    const m=it.per==='min'?60:1;const a=it.lo*wt*m,b=it.hi*wt*m;
    let da=a,db=b,du=it.u;if(du==='mcg'&&b>=1000){da/=1000;db/=1000;du='mg';}
    out.res=rng(da,db,du+'/h');out.vol=volTxt(a,b,it.u,d,'ml/h');
  }else if(it.k==='apap'){
    let dose,mx;
    if(P()&&S.w<=10){dose=7.5*S.w;mx=fmt(30*S.w)+' mg';}
    else if(S.w<=50&&(P()||S.w<50)){dose=15*S.w;mx=fmt(Math.min(60*S.w,P()&&S.w<=33?2000:3000))+' mg';}
    else{dose=1000;mx='4 g';}
    out.res=fmt(dose)+' mg';out.vol=volTxt(dose,dose,'mg',d,'ml');out.cap='สูงสุด/วัน: '+mx;
  }
  if(it.ibw&&isFinite(ibw()))out.cap='ใช้ IBW '+fmt(Math.min(ibw(),S.w))+' kg';
  return out;
}
function macAge(m){const a=S.age>=0&&isFinite(S.age)?S.age:40;return m*Math.pow(10,-0.00269*(a-40));}

function build(){
  const list=$('#list');list.innerHTML='';
  CATS.forEach(c=>{
    const h=document.createElement('div');h.className='cat-h cc';col(h,c);h.textContent=c;h.dataset.cat=c;list.appendChild(h);
    D.filter(d=>d.c===c).forEach(d=>{
      if(d._conc===undefined)d._conc=d.conc;
      const card=document.createElement('div');card.className='card cc';col(card,c);d._el=card;
      const its=d.k==='mac'?[]:items(d);
      let html='<div class="top"><div class="name">'+d.n+'</div>';
      if(d.conc!=null&&its)html+='<label class="conc">ความเข้มข้น <input type="number" inputmode="decimal" step="any" value="'+d._conc+'"> '+d.cu+'/ml</label>';
      html+='</div>';
      if(d.k==='mac'){
        html+='<div class="row"><div><div class="lbl">MAC ตามอายุ</div><div class="pk">ค่าที่อายุ 40 ปี = '+d.mac+'%</div></div><div><div class="res" data-r="mac"></div></div></div>';
        html+='<div class="row"><div><div class="lbl">Maintenance 1–1.3 MAC</div><div class="pk">ลดลงเมื่อให้ร่วมกับ opioid หรือ N₂O</div></div><div><div class="res" data-r="maint"></div></div></div>';
      }else if(!its){
        html+='<div class="na">⛔ ไม่แนะนำหรือไม่มีข้อมูลในเด็ก</div>';
      }else{
        its.forEach((it,i)=>{html+='<div class="row"><div><div class="lbl">'+it.l+'</div><div class="pk">'+pkLabel(it)+'</div></div><div><div class="res" data-i="'+i+'"></div><div class="vol" data-v="'+i+'"></div><div class="cap" data-c="'+i+'" style="text-align:right"></div></div></div>';});
      }
      const nt=note(d);if(nt)html+='<div class="note">'+nt+'</div>';
      card.innerHTML=html;
      const ci=card.querySelector('.conc input');
      if(ci)ci.addEventListener('input',()=>{d._conc=parseFloat(ci.value);updCard(d);});
      list.appendChild(card);
    });
  });
}
function updCard(d){
  const el=d._el;
  if(d.k==='mac'){const m=macAge(d.mac);
    el.querySelector('[data-r=mac]').textContent=fmt(m)+'%';
    el.querySelector('[data-r=maint]').textContent=rng(m,m*1.3,'%');return;}
  const its=items(d);if(!its)return;
  its.forEach((it,i)=>{const o=compute(it,d);
    el.querySelector('[data-i="'+i+'"]').textContent=o.res;
    el.querySelector('[data-v="'+i+'"]').textContent=o.vol;
    el.querySelector('[data-c="'+i+'"]').textContent=o.cap;});
}
function pedCard(){
  const box=$('#ped');if(!P()){box.hidden=true;return;}box.hidden=false;
  const a=S.age,w=S.w,rows=[];
  const R=(l,v,s)=>rows.push('<div class="row"><div><div class="lbl">'+l+'</div>'+(s?'<div class="pk">'+s+'</div>':'')+'</div><div class="res">'+v+'</div></div>');
  if(a>=1&&a<=10)R('น้ำหนักประมาณ (APLS)',fmt((a+4)*2)+' kg','(อายุ + 4) × 2');
  if(isFinite(a)&&a>=0){
    if(a>=2){const h=x=>Math.floor(x*2)/2;const cf=h(a/4+3.5),uc=h(a/4+4);
      R('ETT size','cuffed '+cf+' / uncuffed '+uc,'ID = อายุ/4 + 3.5 (cuffed) หรือ + 4 (uncuffed) · เตรียมเบอร์ ±0.5 ไว้ด้วย');
      R('ETT depth (oral)',fmt(a/2+12)+' cm','อายุ/2 + 12 หรือ 3 × ID');}
    else R('ETT size',a<1?'cuffed 3.0–3.5':'cuffed 3.5–4.0','ทารกแรกเกิดดูตามน้ำหนัก');
  }
  if(w>0){
    const f=w<=10?4*w:w<=20?40+2*(w-10):60+(w-20);
    R('Maintenance fluid (4-2-1)',fmt(f)+' ml/h');
    const ebvk=isFinite(a)&&a<1?80:75;R('EBV',fmt(ebvk*w)+' ml',ebvk+' ml/kg (ทารกแรกเกิด 85–90)');
    R('Defibrillation',fmt(2*w)+' → '+fmt(4*w)+' J','2 J/kg แล้วเพิ่มเป็น 4 J/kg (สูงสุด 10 J/kg)');
    R('Sync. cardioversion',fmt(0.5*w)+'–'+fmt(w)+' → '+fmt(2*w)+' J','0.5–1 J/kg แล้วเพิ่มเป็น 2 J/kg');
  }
  box.innerHTML='<div class="name">👶 ข้อมูลเด็กแบบย่อ</div>'+(rows.length?rows.join(''):'<div class="pk">กรอกน้ำหนักและอายุเพื่อคำนวณ</div>');
}
function updAll(){
  D.forEach(updCard);pedCard();
  const parts=[];
  if(S.w>0)parts.push('น้ำหนัก '+fmt(S.w)+' kg');else parts.push('กรอกน้ำหนักเพื่อคำนวณ');
  if(!P()&&isFinite(ibw()))parts.push('IBW '+fmt(ibw())+' kg');
  if(isFinite(S.age))parts.push('อายุ '+S.age+' ปี (ใช้ปรับ MAC)');
  if(!P()&&S.w>0&&S.w<40)parts.push('⚠️ ถ้าเป็นเด็ก ให้สลับไปใช้โหมดเด็ก');
  $('#info').textContent=parts.join(' · ');
  try{localStorage.setItem('anesdose',JSON.stringify({w:S.w,age:S.age,ht:S.ht,sex:S.sex,mode:S.mode}));}catch(e){}
}
function setMode(m){
  S.mode=m;document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#sub').textContent=P()?'โหมดเด็ก (อายุ >1 เดือน)':'คำนวณยาวิสัญญีตามน้ำหนัก (ผู้ใหญ่)';
  $('#disc').innerHTML=P()
   ?'⚠️ <b>โหมดเด็ก</b> ใช้ขนาดยาสำหรับเด็กอายุมากกว่า 1 เดือน ไม่ครอบคลุมทารกแรกเกิดและทารกคลอดก่อนกำหนด ขนาดที่คำนวณได้ต้องไม่เกินขนาดของผู้ใหญ่ ควร double-check ทุกครั้ง และ titrate ตามอาการ'
   :'⚠️ ใช้เป็นเครื่องมือช่วยคำนวณเท่านั้น ขนาดยาเป็นค่ามาตรฐานจากตำราสำหรับผู้ใหญ่ ต้อง titrate ตามอาการ และปรับตามอายุ ภาวะหัวใจ ตับ ไต และโปรโตคอลของโรงพยาบาลเสมอ ส่วนความเข้มข้นแก้ไขให้ตรงกับยาที่ผสมจริงได้';
  $('#ht').closest('.f').style.display=P()?'none':'';$('.sex').closest('.f').style.display=P()?'none':'';
  $('#w').placeholder=P()?'เช่น 15':'เช่น 60';$('#age').placeholder=P()?'เช่น 3':'เช่น 40';
  build();updAll();filter();
}
function filter(){
  const q=S.q.trim().toLowerCase();let any=false;
  CATS.forEach(c=>{let vis=0;
    D.filter(d=>d.c===c).forEach(d=>{const ok=(S.cat==='ทั้งหมด'||S.cat===c)&&(!q||d.n.toLowerCase().includes(q)||c.toLowerCase().includes(q));d._el.hidden=!ok;if(ok)vis++;});
    document.querySelector('.cat-h[data-cat="'+c+'"]').hidden=!vis;if(vis)any=true;});
  $('#empty').hidden=any;
}
function chips(){
  const box=$('#chips');box.innerHTML='';
  ['ทั้งหมด',...CATS].forEach(c=>{const b=document.createElement('button');b.className='chip'+(S.cat===c?' on':'');b.textContent=c;if(COL[c]){const dt=document.createElement('span');dt.className='dot';dt.style.setProperty('--cd',COL[c][1]);b.prepend(dt);}
    b.onclick=()=>{S.cat=c;chips();filter();window.scrollTo({top:0});};box.appendChild(b);});
}

chips();
let saved=null;try{saved=JSON.parse(localStorage.getItem('anesdose')||'null');}catch(e){}
if(saved){['w','age','ht'].forEach(k=>{if(isFinite(saved[k])&&saved[k]!==null){S[k]=saved[k];$('#'+k).value=saved[k];}});if(saved.sex)S.sex=saved.sex;}
document.querySelectorAll('.sex button').forEach(b=>{b.classList.toggle('on',b.dataset.s===S.sex);
  b.onclick=()=>{S.sex=b.dataset.s;document.querySelectorAll('.sex button').forEach(x=>x.classList.toggle('on',x===b));updAll();};});
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
['w','age','ht'].forEach(k=>$('#'+k).addEventListener('input',e=>{S[k]=parseFloat(e.target.value);updAll();}));
$('#q').addEventListener('input',e=>{S.q=e.target.value;filter();});
setMode(saved&&saved.mode==='P'?'P':'A');
</script>
