<style>
  :root {
    --purple-900: #7a0c47;
    --purple-700: #b3175f;
    --purple-600: #d1267a;
    --purple-500: #e14f96;
    --purple-100: #fbdbea;
    --purple-50: #fdf0f6;
    --white: #ffffff;
    --gray-700: #374151;
    --gray-500: #6b7280;
    --red-600: #dc2626;
    --red-50: #fef2f2;
    --blue-600: #2563eb;
    --blue-50: #eff6ff;
    --green-600: #16a34a;
    --green-50: #f0fdf4;
    --amber-600: #d97706;
    --amber-50: #fffbeb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif;
    background: linear-gradient(180deg, var(--purple-50) 0%, var(--white) 100%);
    color: var(--gray-700);
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, var(--purple-700), var(--purple-900));
    color: white;
    padding: 20px 16px 28px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 4px 12px rgba(179,23,95,0.25);
  }
  header h1 { margin: 0 0 4px; font-size: 1.3rem; }
  header p { margin: 0; font-size: 0.8rem; opacity: 0.85; }

  .weight-bar { max-width: 720px; margin: 14px auto 0; padding: 0 16px; position: relative; z-index: 11; }
  .weight-card {
    background: white; border-radius: 16px;
    box-shadow: 0 6px 20px rgba(179,23,95,0.15);
    padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  }
  .weight-card label { font-weight: 600; font-size: 0.9rem; color: var(--purple-900); white-space: nowrap; }
  .weight-card input {
    flex: 1; border: 2px solid var(--purple-100); border-radius: 10px;
    padding: 10px 12px; font-size: 1rem; outline: none; transition: border-color .15s;
  }
  .weight-card input:focus { border-color: var(--purple-500); }
  .weight-card .unit { color: var(--gray-500); font-size: 0.85rem; }

  .container { max-width: 720px; margin: 20px auto 0; padding: 0 16px; }

  /* Tab menu for the 5 algorithms - vertical stacked list */
  .tab-menu {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
  }
  .tab-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 13px 16px; border-radius: 12px; border: 1.5px solid var(--purple-100);
    background: white; color: var(--purple-700); font-size: 0.9rem; font-weight: 600;
    cursor: pointer; text-align: left; transition: all .15s;
    box-shadow: 0 1px 4px rgba(179,23,95,0.06);
  }
  .tab-btn::after {
    content: '›'; font-size: 1.2rem; font-weight: 700; color: var(--purple-300, #f0a8cc);
    transition: transform .15s;
  }
  .tab-btn.active { background: var(--purple-700); color: white; border-color: var(--purple-700); }
  .tab-btn.active::after { color: white; transform: rotate(90deg); }
  .tab-group-title {
    font-size: 0.75rem; font-weight: 700; color: var(--purple-500);
    text-transform: uppercase; letter-spacing: 0.03em; margin: 10px 0 -2px 4px;
  }
  .tab-group-title:first-child { margin-top: 0; }

  .algo-section { display: none; }
  .algo-section.active { display: block; }

  .card {
    background: white; border-radius: 16px; box-shadow: 0 2px 10px rgba(179,23,95,0.08);
    border: 1px solid var(--purple-100); padding: 16px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.05rem; color: var(--purple-900); }
  .card .subtitle { font-size: 0.78rem; color: var(--gray-500); margin-bottom: 10px; }

  .step-item {
    display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--purple-100);
  }
  .step-item:last-child { border-bottom: none; }
  .step-num {
    flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--purple-600); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700;
  }
  .step-text { flex: 1; }
  .step-title { font-weight: 600; font-size: 0.9rem; color: var(--gray-700); }
  .step-detail { font-size: 0.82rem; color: var(--gray-500); margin-top: 2px; }

  .branch-item { margin-top: 6px; padding: 8px 10px; background: var(--purple-50); border-radius: 8px; font-size: 0.82rem; }
  .branch-item b { color: var(--purple-700); }

  .keynum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .keynum { background: var(--purple-50); border-radius: 10px; padding: 8px 10px; }
  .keynum .kn-label { font-size: 0.72rem; color: var(--gray-500); }
  .keynum .kn-value { font-size: 0.92rem; font-weight: 700; color: var(--purple-700); }

  .quality-list { margin: 6px 0 0; padding-left: 18px; font-size: 0.85rem; }
  .quality-list li { margin-bottom: 4px; }

  .branch-card {
    border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; border-left: 5px solid;
  }
  .branch-card.red { background: var(--red-50); border-color: var(--red-600); }
  .branch-card.blue { background: var(--blue-50); border-color: var(--blue-600); }
  .branch-card.green { background: var(--green-50); border-color: var(--green-600); }
  .branch-card.amber { background: var(--amber-50); border-color: var(--amber-600); }
  .branch-card h3 { margin: 0 0 8px; font-size: 0.95rem; }
  .branch-card.red h3 { color: var(--red-600); }
  .branch-card.blue h3 { color: var(--blue-600); }
  .branch-card.green h3 { color: var(--green-600); }
  .branch-card.amber h3 { color: var(--amber-600); }
  .branch-steps { margin: 0; padding-left: 18px; font-size: 0.84rem; }
  .branch-steps li { margin-bottom: 6px; }

  .subgroup { background: white; border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .subgroup .sg-title { font-weight: 700; font-size: 0.82rem; color: var(--purple-700); margin-bottom: 4px; }
  .subgroup ul { margin: 0; padding-left: 16px; font-size: 0.8rem; }
  .subgroup li { margin-bottom: 3px; }

  .energy-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
  .energy-table td { padding: 6px 4px; border-bottom: 1px solid var(--purple-100); }
  .energy-table td:last-child { text-align: right; font-weight: 700; color: var(--purple-700); }

  .drug-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0; border-bottom: 1px dashed var(--purple-100); font-size: 0.86rem; gap: 8px;
  }
  .drug-row:last-child { border-bottom: none; }
  .drug-name { font-weight: 600; color: var(--gray-700); }
  .drug-dose-label { flex: 1; color: var(--gray-500); font-size: 0.78rem; }
  .drug-value { font-weight: 700; color: var(--purple-700); background: var(--purple-50); padding: 3px 8px; border-radius: 8px; white-space: nowrap; }

  .cause-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; font-size: 0.78rem; }
  .cause-grid .cause-col b { color: var(--purple-700); display:block; margin-bottom: 4px; }
  .cause-grid ul { margin: 0; padding-left: 16px; }

  details.info-block { margin-top: 6px; font-size: 0.82rem; }
  details.info-block summary { cursor: pointer; color: var(--purple-600); font-weight: 600; padding: 4px 0; }

  .note-box {
    background: var(--amber-50); border-left: 4px solid var(--amber-600);
    padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; margin-top: 8px; color: #7c4a03;
  }

  .footer-note { max-width: 720px; margin: 20px auto; padding: 12px 16px; font-size: 0.72rem; color: var(--gray-500); text-align: center; }
</style>

diac Arrest", "nameThai": "การช่วยชีวิตขั้นสูงในเด็ก — ภาวะหัวใจหยุดเต้น", "icon": "activity-square", "steps": [{"no": 1, "title": "เริ่มทำ CPR", "detail": "เริ่ม bag-mask ventilation และให้ออกซิเจน ติด monitor/defibrillator"}, {"no": 2, "title": "ตรวจจังหวะการเต้นของหัวใจ — เป็นจังหวะที่ต้องช็อกไฟฟ้าหรือไม่", "detail": "แบ่งเป็น 2 กลุ่ม: VF/pVT (ต้องช็อกไฟฟ้า) และ Asystole/PEA (ไม่ต้องช็อกไฟฟ้า)"}], "branches": [{"id": "shockable", "title": "VF / pVT (ต้องช็อกไฟฟ้า)", "color": "red", "steps": ["ช็อกไฟฟ้าโดยด่วนที่สุด (Shock ASAP) → CPR 2 นาที พร้อมเปิดหลอดเลือดดำ (IV/IO)", "ตรวจจังหวะ — ยัง shockable: ช็อกไฟฟ้าโดยด่วนที่สุด → CPR 2 นาที ให้ Epinephrine ทุก 3-5 นาที พิจารณาใส่ advanced airway และ capnography", "ตรวจจังหวะ — ยัง shockable: ช็อกไฟฟ้าโดยด่วนที่สุด → CPR 2 นาที ให้ Amiodarone หรือ Lidocaine และรักษาสาเหตุที่แก้ไขได้ (5H/5T)", "วนขั้นตอนต่อจนกว่าจะไม่ shockable หรือมี ROSC", "ถ้าไม่มีสัญญาณ ROSC → กลับไปที่ Asystole/PEA pathway (CPR 2 นาที) | ถ้ามี ROSC → ไปที่ Post-Cardiac Arrest Care checklist"]}, {"id": "nonshockable", "title": "Asystole / PEA (ไม่ต้องช็อกไฟฟ้า)", "color": "blue", "steps": ["ให้ Epinephrine โดยด่วนที่สุด (ASAP) → CPR 2 นาที พร้อมเปิดหลอดเลือดดำ (IV/IO), ให้ Epinephrine ทุก 3-5 นาที, พิจารณาใส่ advanced airway และ capnography", "ตรวจจังหวะ — ถ้า shockable → ไปกลุ่ม VF/pVT", "ตรวจจังหวะ — ถ้ายังไม่ shockable → CPR 2 นาที รักษาสาเหตุที่แก้ไขได้ (5H/5T)", "ตรวจจังหวะซ้ำ — ถ้า shockable → ไปกลุ่ม VF/pVT | ถ้าไม่ shockable → วนขั้นตอน CPR 2 นาทีต่อ (กลับไปข้อแรกของกลุ่มนี้)"]}], "highQualityCPR": ["กดหน้าอกให้แรงพอ (≥1/3 ของเส้นผ่านศูนย์กลางทรวงอกแนวหน้า-หลัง)", "กดหน้าอกเร็วพอ: 100-120 ครั้ง/นาที", "ปล่อยหน้าอกให้คืนตัวกลับอย่างเต็มที่", "ลดการหยุดชะงักในการกดหน้าอกให้น้อยที่สุด", "เปลี่ยนคนกดหน้าอกทุก 2 นาที หรือเร็วกว่านั้นถ้าเหนื่อยล้า", "ถ้ายังไม่ได้ใส่ advanced airway ใช้อัตราส่วนกดหน้าอก:ช่วยหายใจ = 15:2 (ผู้ช่วยเหลือ 2 คน, ก่อนวัยเจริญพันธุ์) หรือ 30:2 (ผู้ช่วยเหลือ 2 คน, เข้าสู่วัยเจริญพันธุ์แล้ว) หรือ 30:2 (ผู้ช่วยเหลือ 1 คน ทุกช่ function round(num, decimals) {
  decimals = decimals || 2;
  const factor = Math.pow(10, decimals);
  return Math.round(num * factor) / factor;
}

function calcDoseText(entry, weightKg) {
  const w = Number(weightKg);
  const hasWeight = !isNaN(w) && w > 0;
  switch (entry.type) {
    case 'fixed_value':
      return entry.mg + ' ' + entry.unit;
    case 'fixed_range':
      return entry.minMcg + '-' + entry.maxMcg + ' ' + entry.unit;
    case 'weight_fixed': {
      const perKg = entry.mgKg;
      const unit = entry.unit || 'mg/kg';
      if (!hasWeight) return perKg + ' ' + unit;
      const value = round(perKg * w, 3);
      return value + ' mg';
    }
    case 'weight_range': {
      const unit = entry.unit || 'mg/kg';
      const minV = entry.minMgKg, maxV = entry.maxMgKg;
      if (!hasWeight) return minV + '-' + maxV + ' ' + unit;
      const min = round(minV * w, 2), max = round(maxV * w, 2);
      return min + ' - ' + max + ' mg';
    }
    case 'weight_rate_range': {
      const minV = entry.minMcgKgMin, maxV = entry.maxMcgKgMin;
      const unit = entry.unit || 'mcg/kg/min';
      if (!hasWeight) return minV + '-' + maxV + ' ' + unit;
      const min = round(minV * w, 1), max = round(maxV * w, 1);
      return min + ' - ' + max + ' mcg/min';
    }
    default: return '';
  }
}

function renderSteps(steps) {
  return steps.map(s => {
    const branchesHtml = (s.branches || []).map(b =>
      '<div class="branch-item"><b>' + b.condition + '</b><br>' + b.action + '</div>'
    ).join('');
    return '<div class="step-item">' +
      '<div class="step-num">' + s.no + '</div>' +
      '<div class="step-text">' +
        '<div class="step-title">' + s.title + '</div>' +
        (s.detail ? '<div class="step-detail">' + s.detail + '</div>' : '') +
        branchesHtml +
      '</div>' +
    '</div>';
  }).join('');
}

function renderBranchCard(branch, weightKg) {
  let inner = '<h3>' + branch.title + '</h3>';
  if (branch.detail) inner += '<div style="font-size:0.83rem;margin-bottom:8px;">' + branch.detail + '</div>';
  if (branch.steps) {
    inner += '<ol class="branch-steps">' + branch.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>';
  }
  if (branch.cardioversionEnergy) {
    inner += '<table class="energy-table">' + branch.cardioversionEnergy.map(e =>
      '<tr><td>' + e.rhythm + '</td><td>' + e.energy + '</td></tr>'
    ).join('') + '</table>';
  }
  if (branch.subgroups) {
    inner += branch.subgroups.map(sg =>
      '<div class="subgroup"><div class="sg-title">' + sg.title + '</div><ul>' +
      sg.steps.map(s => '<li>' + s + '</li>').join('') + '</ul></div>'
    ).join('');
  }
  if (branch.specialNote) {
    inner += '<div class="note-box">⚠️ ' + branch.specialNote + '</div>';
  }
  return '<div class="branch-card ' + branch.color + '">' + inner + '</div>';
}

function renderDrugs(drugs, weightKg) {
  if (!drugs || !drugs.length) return '';
  let rows = '';
  drugs.forEach(d => {
    d.dosing.forEach(entry => {
      rows += '<div class="drug-row">' +
        '<div><span class="drug-name">' + d.name + '</span> <span class="drug-dose-label">' + entry.label +
        (entry.route ? ' (' + entry.route + ')' : '') +
        (entry.note ? ' — ' + entry.note : '') + '</span></div>' +
        '<div class="drug-value">' + calcDoseText(entry, weightKg) + '</div>' +
      '</div>';
    });
  });
  return '<div class="card"><h2>💉 ขนาดยาที่ใช้</h2>' + rows + '</div>';
}

function renderAlgorithm(algo, weightKg) {
  let html = '';

  // Main steps card
  html += '<div class="card"><h2>' + algo.nameThai + '</h2>';
  if (algo.ageNote) html += '<div class="subtitle">👶 ' + algo.ageNote + '</div>';
  if (algo.steps) html += '<div>' + renderSteps(algo.steps) + '</div>';

  if (algo.unstableCriteria) {
    const title = algo.unstableCriteriaTitle || 'เกณฑ์ "อาการไม่คงที่"';
    html += '<div class="note-box"><b>' + title + '</b> (มีข้อใดข้อหนึ่ง):<ul style="margin:4px 0 0;padding-left:18px;">' +
      algo.unstableCriteria.map(c => '<li>' + c + '</li>').join('') + '</ul></div>';
  }

  if (algo.sinusVsSvt) {
    const sv = algo.sinusVsSvt;
    html += '<div class="branch-card green"><h3>' + sv.sinusTach.title + '</h3><ul class="branch-steps">' +
      sv.sinusTach.criteria.map(c => '<li>' + c + '</li>').join('') + '</ul>' +
      (sv.sinusTach.action ? '<div style="font-size:0.82rem;margin-top:6px;">➡️ ' + sv.sinusTach.action + '</div>' : '') +
    '</div>';
    html += '<div class="branch-card amber"><h3>' + sv.svt.title + '</h3><ul class="branch-steps">' +
      sv.svt.criteria.map(c => '<li>' + c + '</li>').join('') + '</ul></div>';
  }

  if (algo.qualityPoints) {
    html += '<details class="info-block" open><summary>การช่วยชีวิตอย่างมีประสิทธิภาพ</summary><ul class="quality-list">' +
      algo.qualityPoints.map(q => '<li>' + q + '</li>').join('') + '</ul></details>';
  }

  if (algo.highQualityCPR) {
    html += '<details class="info-block" open><summary>High-Quality CPR</summary><ul class="quality-list">' +
      algo.highQualityCPR.map(q => '<li>' + q + '</li>').join('') + '</ul></details>';
  }

  if (algo.keyNumbers) {
    html += '<div class="keynum-grid">' + algo.keyNumbers.map(k =>
      '<div class="keynum"><div class="kn-label">' + k.label + '</div><div class="kn-value">' + k.value + '</div></div>'
    ).join('') + '</div>';
  }

  // Goal box (pregnancy)
  if (algo.goal) {
    html += '<div class="note-box"><b>🎯 ' + algo.goal.title + ':</b> ' + algo.goal.detail + '</div>';
  }

  if (algo.note) html += '<div class="note-box">' + algo.note + '</div>';
  html += '</div>';

  // Branches
  if (algo.branches) {
    html += '<div class="card"><h2>แนวทางแยกตามกลุ่มอาการ</h2>' +
      algo.branches.map(b => renderBranchCard(b, weightKg)).join('') +
    '</div>';
  }

  // Shock energy (J/kg) - pediatric
  if (algo.shockEnergy) {
    const w = Number(weightKg);
    const hasW = !isNaN(w) && w > 0;
    html += '<div class="card"><h2>⚡ ' + algo.shockEnergy.title + '</h2><table class="energy-table">' +
      algo.shockEnergy.items.map(it => {
        const val = hasW ? round(it.joulesPerKg * w, 1) + ' J' : it.joulesPerKg + ' J/kg';
        return '<tr><td>' + it.label + (it.note ? '<div class="dose-note" style="color:#9ca3af;font-size:0.72rem;">' + it.note + '</div>' : '') + '</td><td>' + val + '</td></tr>';
      }).join('') + '</table></div>';
  }

  // Algorithm-level cardioversion energy (pediatric tachycardia)
  if (algo.cardioversionEnergy) {
    const w = Number(weightKg);
    const hasW = !isNaN(w) && w > 0;
    html += '<div class="card"><h2>⚡ Synchronized Cardioversion</h2><table class="energy-table">' +
      algo.cardioversionEnergy.map(e => {
        let val = e.energy;
        if (hasW) {
          const m = e.energy.match(/([\d.]+)(?:-([\d.]+))?\s*J\/kg/);
          if (m) {
            const lo = round(parseFloat(m[1]) * w, 1);
            val = m[2] ? (lo + ' - ' + round(parseFloat(m[2]) * w, 1) + ' J') : (lo + ' J');
          }
        }
        return '<tr><td>' + e.rhythm + '</td><td>' + val + '</td></tr>';
      }).join('') + '</table>' +
      (algo.cardioversionNote ? '<div class="note-box">' + algo.cardioversionNote + '</div>' : '') +
    '</div>';
  }

  // Advanced airway (pediatric cardiac arrest)
  if (algo.advancedAirway) {
    html += '<details class="info-block"><summary>Advanced Airway</summary><ul class="quality-list">' +
      algo.advancedAirway.map(a => '<li>' + a + '</li>').join('') + '</ul></details>';
  }

  // Defibrillation notes (cardiac arrest specific)
  if (algo.defibrillationNotes) {
    html += '<div class="card"><h2>⚡ การช็อกไฟฟ้า</h2><ul class="quality-list">' +
      algo.defibrillationNotes.map(n => '<li>' + n + '</li>').join('') + '</ul></div>';
  }

  // Reversible causes 5H/5T
  if (algo.reversibleCauses) {
    html += '<div class="card"><h2>🔍 ' + algo.reversibleCauses.title + '</h2><div class="cause-grid">' +
      '<div class="cause-col"><b>5H</b><ul>' + algo.reversibleCauses.H.map(h => '<li>' + h + '</li>').join('') + '</ul></div>' +
      '<div class="cause-col"><b>5T</b><ul>' + algo.reversibleCauses.T.map(t => '<li>' + t + '</li>').join('') + '</ul></div>' +
    '</div></div>';
  }

  // Team members (pregnancy)
  if (algo.teamMembers) {
    html += '<details class="info-block"><summary>' + algo.teamMembers.title + '</summary><ul class="quality-list">' +
      algo.teamMembers.items.map(m => '<li>' + m + '</li>').join('') + '</ul></details>';
  }

  // Key points (pregnancy)
  if (algo.keyPoints) {
    html += '<div class="card"><h2>💡 ประเด็นสำคัญ</h2><ul class="quality-list">' +
      algo.keyPoints.map(p => '<li>' + p + '</li>').join('') + '</ul></div>';
  }

  // Etiologies mnemonic table (pregnancy A-H)
  if (algo.etiologies) {
    html += '<div class="card"><h2>🔍 ' + algo.etiologies.title + '</h2><table class="energy-table">' +
      algo.etiologies.items.map(it =>
        '<tr><td style="width:24px;"><b style="color:var(--purple-700);">' + it.letter + '</b></td><td style="text-align:left;font-weight:400;color:var(--gray-700);">' + it.cause + '</td></tr>'
      ).join('') + '</table></div>';
  }

  // Common causes (bradycardia)
  if (algo.commonCauses) {
    html += '<div class="card"><h2>🔍 สาเหตุที่พบบ่อย</h2><ul class="quality-list">' +
      algo.commonCauses.map(c => '<li>' + c + '</li>').join('') + '</ul></div>';
  }

  // Immediate care (post-cardiac arrest)
  if (algo.immediateCare) {
    html += '<div class="card"><h2>🚑 การดูแลเบื้องต้นหลัง ROSC</h2>' +
      algo.immediateCare.map(c => '<div class="step-item"><div class="step-text"><div class="step-title">' + c.title + '</div><div class="step-detail">' + c.detail + '</div></div></div>').join('') +
    '</div>';
  }

  if (algo.decisionPoint) {
    const dp = algo.decisionPoint;
    html += '<div class="card"><h2>❓ ' + dp.question + '</h2>' +
      '<div class="branch-card green"><h3>' + dp.follows.label + '</h3><div style="font-size:0.85rem">' + dp.follows.action + '</div></div>' +
      '<div class="branch-card amber"><h3>' + dp.notFollows.label + '</h3><div style="font-size:0.85rem">' + dp.notFollows.action + '</div></div>' +
    '</div>';
  }

  if (algo.continuedCare) {
    html += '<div class="card"><h2>🏥 การดูแลต่อเนื่อง</h2>' +
      algo.continuedCare.map(c => '<div class="step-item"><div class="step-text"><div class="step-title">' + c.title + '</div><div class="step-detail">' + c.detail + '</div></div></div>').join('') +
    '</div>';
  }

  // Drugs
  html += renderDrugs(algo.drugs, weightKg);

  return html;
}

const PREG_PREFIX = 'pregnancy_';

function renderTabs() {
  const adult = CPR_DATA.algorithms.filter(a => !a.id.startsWith(PEDS_PREFIX) && !a.id.startsWith(PREG_PREFIX));
  const peds = CPR_DATA.algorithms.filter(a => a.id.startsWith(PEDS_PREFIX));
  const preg = CPR_DATA.algorithms.filter(a => a.id.startsWith(PREG_PREFIX));

  const btn = a => '<button class="tab-btn' + (a.id === activeAlgoId ? ' active' : '') + '" onclick="setActive(\'' + a.id + '\')">' + a.name + '</button>';

  let html = '<div class="tab-group-title">🧑‍⚕️ ผู้ใหญ่ (Adult)</div>';
  html += adult.map(btn).join('');
  html += '<div class="tab-group-title">👶 เด็ก (Pediatric)</div>';
  html += peds.map(btn).join('');
  html += '<div class="tab-group-title">🤰 หญิงตั้งครรภ์ (Pregnancy)</div>';
  html += preg.map(btn).join('');

  tabMenu.innerHTML = html;
}

function renderActive() {
  const weightKg = parseFloat(weightInput.value);
  const algo = CPR_DATA.algorithms.find(a => a.id === activeAlgoId);
  algoContainer.innerHTML = renderAlgorithm(algo, weightKg);
}

function setActive(id) {
  activeAlgoId = id;
  renderTabs();
  renderActive();
}

weightInput.addEventListener('input', renderActive);

renderTabs();
renderActive();
</script>
</body>
</html>
